
name: Обновление NordLine_Free

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-subscriptions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: |
          python -m pip install pyyaml
          sudo apt-get update
          sudo apt-get install -y unzip curl

      - name: Скачать Xray-core
        run: |
          mkdir -p xray
          curl -fLsS --retry 3 \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip \
            -o /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d xray
          chmod +x xray/xray

      - name: Скачать Mihomo для проверки конфигов
        run: |
          mkdir -p mihomo
          curl -fLsS --retry 3 --connect-timeout 20 --max-time 120 \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-compatible-v1.19.33.gz \
            -o /tmp/mihomo.gz
          gzip -dc /tmp/mihomo.gz > mihomo/mihomo
          chmod +x mihomo/mihomo

      - name: Проверить регрессии и начальную маршрутизацию
        env:
          XRAY_BIN: ${{ github.workspace }}/xray/xray
          MIHOMO_BIN: ${{ github.workspace }}/mihomo/mihomo
        run: python -m unittest -v

      - name: Собрать исходные конфигурации
        run: |
          mkdir -p sources

          fetch() {
            curl -fLsS --retry 3 \
              --connect-timeout 20 --max-time 120 \
              "$2" -o "sources/$1"
          }

          fetch universal.txt \
            https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt

          fetch lite.txt \
            https://raw.githubusercontent.com/zieng2/wl/main/vless_lite.txt

          fetch white_cidr.txt \
            https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-all.txt

          fetch white_sni.txt \
            https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-SNI-RU-all.txt

          fetch white_checked.txt \
            https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/WHITE-CIDR-RU-checked.txt

          fetch black.txt \
            https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/main/BLACK_VLESS_RUS.txt

          fetch keys.json \
            https://raw.githubusercontent.com/tiagorrg/vless-checker/main/docs/keys.json

          python extract_keys.py sources/keys.json sources/keys.txt

          fetch bypass.txt \
            https://raw.githubusercontent.com/whoahaow/rjsxrd/main/githubmirror/bypass/bypass-all.txt

          cat sources/universal.txt sources/lite.txt \
            sources/white_cidr.txt sources/white_sni.txt \
            sources/white_checked.txt sources/black.txt \
            sources/keys.txt sources/bypass.txt \
            > sources/combined.txt

          test -s sources/combined.txt

      - name: Проверить серверы
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python probe.py \
            xray/xray build.py \
            sources/probe.json \
            sources/combined.txt

      - name: Пересобрать подписки
        run: |
          python build.py \
            "sources/universal.txt,sources/lite.txt,sources/white_cidr.txt,sources/white_sni.txt,sources/white_checked.txt,sources/black.txt=bl,sources/keys.txt=auto,sources/bypass.txt=cap" \
            output --alive sources/probe.json

      - name: Проверить подписки перед публикацией
        run: |
          python validate.py output --previous . --require-probe \
            --xray xray/xray --mihomo mihomo/mihomo

      - name: Обновить публикуемые файлы
        run: cp output/* .

      - name: Сохранить обновления в GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add auto.json all.txt whitelist.txt \
            regular.txt ai.txt ru_only.txt \
            unverified.txt unverified.json health.json \
            clash_regular.yaml clash_whitelist.yaml \
            stats.json

          if ! git diff --cached --quiet; then
            git commit -m "Auto update VPN subscriptions"
            git push
          else
            echo "Изменений нет"
          fi
